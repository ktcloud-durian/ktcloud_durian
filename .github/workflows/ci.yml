name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: ${{ fromJSON(vars.BUILD_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Lint
        working-directory: app
        run: npm run lint
      - name: Test
        working-directory: app
        run: npm test

  docker-verify:
    if: github.event.pull_request.draft == false
    # 이미지 빌드 검증 (push 없음). runner 전환은 repo 변수 BUILD_RUNNER 참고
    runs-on: ${{ fromJSON(vars.BUILD_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    needs: [test, docker-verify]
    if: ${{ always() && github.event.pull_request.draft == false && !contains(needs.*.result, 'cancelled') }}
    uses: ./.github/workflows/_notify.yml
    secrets: inherit
    with:
      kind: ci
      status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
      results: test=${{ needs.test.result }},docker=${{ needs.docker-verify.result }}
