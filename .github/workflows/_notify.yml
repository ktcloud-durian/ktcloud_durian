name: Notify

on:
  workflow_call:
    inputs:
      kind:
        description: "ci 또는 release"
        required: true
        type: string
      status:
        required: true
        type: string
      tag:
        required: false
        type: string
        default: ""
      # 단계별 결과 (success / failure / skipped)
      build_result:
        required: false
        type: string
        default: ""
      staging_result:
        required: false
        type: string
        default: ""
      prod_result:
        required: false
        type: string
        default: ""
      test_result:
        required: false
        type: string
        default: ""
      docker_result:
        required: false
        type: string
        default: ""
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false

jobs:
  discord:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send Discord message
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          KIND: ${{ inputs.kind }}
          STATUS: ${{ inputs.status }}
          TAG: ${{ inputs.tag }}
          BUILD_R: ${{ inputs.build_result }}
          STAGING_R: ${{ inputs.staging_result }}
          PROD_R: ${{ inputs.prod_result }}
          TEST_R: ${{ inputs.test_result }}
          DOCKER_R: ${{ inputs.docker_result }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL 이 설정되지 않아 알림을 건너뜁니다."
            exit 0
          fi

          WHAT=""
          case "$KIND/$STATUS" in
            ci/success)
              TITLE="✅ 테스트 통과"; COLOR=3066993
              NEXT="리뷰어가 승인하면 Merge 버튼으로 머지할 수 있습니다." ;;
            ci/failure)
              TITLE="❌ 테스트 실패"; COLOR=15158332
              if [ "$TEST_R" = "failure" ]; then WHAT="실패 단계: 코드 검사(lint) 또는 테스트(test)"; else WHAT="실패 단계: Docker 이미지 빌드 확인"; fi
              NEXT="아래 [실행 로그]를 열어 빨간 줄을 확인하세요. 코드를 고쳐서 push하면 같은 PR에서 자동으로 다시 검사합니다." ;;
            release/success)
              TITLE="🚀 배포 반영 완료"; COLOR=3066993
              WHAT="이미지 태그: ${TAG}"
              NEXT="서비스가 정상 동작하는지 확인하세요. 문제가 있으면 CI/CD 메인에게 이전 태그로 되돌리기(롤백)를 요청하세요." ;;
            release/failure)
              TITLE="❌ 빌드/배포 실패"; COLOR=15158332
              if [ "$BUILD_R" = "failure" ]; then WHAT="실패 단계: 빌드(테스트, 이미지 생성)"
              elif [ "$STAGING_R" = "failure" ]; then WHAT="실패 단계: staging 배포"
              elif [ "$PROD_R" = "failure" ]; then WHAT="실패 단계: prod 배포"
              else WHAT="실패 단계: 확인 필요"; fi
              NEXT="직접 재시도하지 말고, [실행 로그] 링크를 CI/CD 메인에게 공유하세요. (비밀값 누락이면 메인이 설정합니다.)" ;;
            *)
              TITLE="ℹ️ 파이프라인 알림"; COLOR=9807270
              NEXT="[실행 로그]를 확인하세요." ;;
          esac

          LINKS="[실행 로그 보기]($RUN_URL)"
          if [ -n "$PR_URL" ]; then LINKS="$LINKS · [PR 열기]($PR_URL)"; fi

          DESC="**$REPO**"
          if [ -n "$PR_TITLE" ]; then DESC="$DESC"$'\n'"PR: $PR_TITLE"; fi
          if [ -n "$WHAT" ]; then DESC="$DESC"$'\n'"$WHAT"; fi

          jq -n \
            --arg title "$TITLE" \
            --arg desc "$DESC" \
            --arg url "$RUN_URL" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg sha "${SHA:0:7}" \
            --arg next "$NEXT" \
            --arg links "$LINKS" \
            --argjson color "$COLOR" \
            '{embeds: [{
               title: $title, description: $desc, url: $url, color: $color,
               fields: [
                 {name: "브랜치", value: $branch, inline: true},
                 {name: "작성자", value: $actor, inline: true},
                 {name: "커밋", value: $sha, inline: true},
                 {name: "👉 다음에 할 일", value: $next},
                 {name: "바로가기", value: $links}
               ],
               footer: {text: "막히면 CI/CD 메인/보조에게 문의하세요. 실패는 정상적인 과정입니다."}
            }]}' \
          | curl -sS -f -H "Content-Type: application/json" -d @- "$WEBHOOK"
