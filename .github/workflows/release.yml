name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # GHCR 이미지 이름은 소문자여야 함. 아래 build 단계에서 소문자로 변환
  REGISTRY: ghcr.io

jobs:
  build:
    # 기본: ubuntu-latest / self-hosted 전환: Repository variable BUILD_RUNNER = ["self-hosted","linux","ec2"]
    runs-on: ${{ fromJSON(vars.BUILD_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign 키 없는 서명 (GitHub OIDC). 이 job에만 줌
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Test
        working-directory: app
        run: |
          npm run lint
          npm test

      - id: vars
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 공급망 보안 (보안 기준서 PIP-06, 포트폴리오): 올린 이미지의 SBOM(부품 목록)을 만들고, 이미지와 SBOM에 서명
      # 서명은 키 없이 GitHub OIDC로 (Sigstore). 태그가 아니라 digest에 서명해서 바꿔치기를 막음
      - name: SBOM 만들기 (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: 이미지 서명 + SBOM 첨부
        env:
          REF: ${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
          echo "서명한 이미지: ${REF}" >> "$GITHUB_STEP_SUMMARY"

  # 배포 = gitops 저장소의 이미지 태그를 수정해 push (이후 ArgoCD가 반영)
  # 필요: Secret GITOPS_TOKEN (fine-grained PAT, gitops 저장소 Contents: Read and write)
  # 선택: Variable GITOPS_REPO (기본 ktcloud-durian/cicd-platform-gitops)
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Update staging tag in gitops repo
        env:
          GITOPS_REPO: ${{ vars.GITOPS_REPO || 'ktcloud-durian/cicd-platform-gitops' }}
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
          OVERLAY: staging
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then echo "::error::GITOPS_TOKEN secret is not set"; exit 1; fi
          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPO}.git" gitops
          cd gitops
          f="apps/sample-app/overlays/${OVERLAY}/kustomization.yaml"
          sed -i -E "s|^(\s*newName:).*|\1 ${IMAGE}|; s|^(\s*newTag:).*|\1 ${TAG}|" "$f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "no change"; exit 0; fi
          git commit -am "deploy(${OVERLAY}): ${TAG} (${GITHUB_REPOSITORY}@${GITHUB_SHA::7})"
          for i in 1 2 3; do
            git push origin HEAD:main && break
            git pull --rebase origin main
          done

  # production Environment에 Required reviewers를 설정하면 승인 후 실행됨
  # prod ArgoCD Application은 수동 Sync이므로 Argo UI에서 Sync해야 실제 반영됨
  deploy-prod:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Update prod tag in gitops repo
        env:
          GITOPS_REPO: ${{ vars.GITOPS_REPO || 'ktcloud-durian/cicd-platform-gitops' }}
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
          OVERLAY: prod
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then echo "::error::GITOPS_TOKEN secret is not set"; exit 1; fi
          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPO}.git" gitops
          cd gitops
          f="apps/sample-app/overlays/${OVERLAY}/kustomization.yaml"
          sed -i -E "s|^(\s*newName:).*|\1 ${IMAGE}|; s|^(\s*newTag:).*|\1 ${TAG}|" "$f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "no change"; exit 0; fi
          git commit -am "deploy(${OVERLAY}): ${TAG} (${GITHUB_REPOSITORY}@${GITHUB_SHA::7})"
          for i in 1 2 3; do
            git push origin HEAD:main && break
            git pull --rebase origin main
          done

  notify:
    if: ${{ always() }}
    needs: [build, deploy-staging, deploy-prod]
    uses: ./.github/workflows/_notify.yml
    secrets: inherit
    with:
      kind: release
      tag: ${{ needs.build.outputs.tag }}
      status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
      results: build=${{ needs.build.result }},staging=${{ needs.deploy-staging.result }},prod=${{ needs.deploy-prod.result }}
