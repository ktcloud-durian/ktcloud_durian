name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # GHCR ?¥Î?ÏßÄ ?¥Î¶Ñ?Ä ?åÎ¨∏?êÏó¨???? ?ÑÎûò build ?®Í≥Ñ?êÏÑú ?åÎ¨∏?êÎ°ú Î≥Ä??
  REGISTRY: ghcr.io

jobs:
  build:
    # Í∏∞Î≥∏: ubuntu-latest / self-hosted ?ÑÌôò: Repository variable BUILD_RUNNER = ["self-hosted","linux","ec2"]
    runs-on: ${{ fromJSON(vars.BUILD_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Test
        working-directory: app
        run: |
          npm run lint
          npm test

      - id: vars
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Î∞∞Ìè¨ = gitops ?Ä?•ÏÜå???¥Î?ÏßÄ ?úÍ∑∏Î•??òÏ†ï??push (?¥ÌõÑ ArgoCDÍ∞Ä Î∞òÏòÅ)
  # ?ÑÏöî: Secret GITOPS_TOKEN (fine-grained PAT, gitops ?Ä?•ÏÜå Contents: Read and write)
  # ?†ÌÉù: Variable GITOPS_REPO (Í∏∞Î≥∏ ktcloud-durian/cicd-platform-gitops)
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Update staging tag in gitops repo
        env:
          GITOPS_REPO: ${{ vars.GITOPS_REPO || 'ktcloud-durian/cicd-platform-gitops' }}
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
          OVERLAY: staging
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then echo "::error::GITOPS_TOKEN secret is not set"; exit 1; fi
          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPO}.git" gitops
          cd gitops
          f="apps/sample-app/overlays/${OVERLAY}/kustomization.yaml"
          sed -i -E "s|^(\s*newName:).*|\1 ${IMAGE}|; s|^(\s*newTag:).*|\1 ${TAG}|" "$f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "no change"; exit 0; fi
          git commit -am "deploy(${OVERLAY}): ${TAG} (${GITHUB_REPOSITORY}@${GITHUB_SHA::7})"
          for i in 1 2 3; do
            git push origin HEAD:main && break
            git pull --rebase origin main
          done

  # production Environment??Required reviewersÎ•??§Ï†ï?òÎ©¥ ?πÏù∏ ???§Ìñâ??
  # prod ArgoCD Application?Ä ?òÎèô Sync?¥Î?Î°?Argo UI?êÏÑú Sync?¥Ïïº ?§Ï†ú Î∞òÏòÅ??
  deploy-prod:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Update prod tag in gitops repo
        env:
          GITOPS_REPO: ${{ vars.GITOPS_REPO || 'ktcloud-durian/cicd-platform-gitops' }}
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
          OVERLAY: prod
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then echo "::error::GITOPS_TOKEN secret is not set"; exit 1; fi
          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPO}.git" gitops
          cd gitops
          f="apps/sample-app/overlays/${OVERLAY}/kustomization.yaml"
          sed -i -E "s|^(\s*newName:).*|\1 ${IMAGE}|; s|^(\s*newTag:).*|\1 ${TAG}|" "$f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "no change"; exit 0; fi
          git commit -am "deploy(${OVERLAY}): ${TAG} (${GITHUB_REPOSITORY}@${GITHUB_SHA::7})"
          for i in 1 2 3; do
            git push origin HEAD:main && break
            git pull --rebase origin main
          done

  notify:
    if: ${{ always() }}
    needs: [build, deploy-staging, deploy-prod]
    uses: ./.github/workflows/_notify.yml
    secrets: inherit
    with:
      status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
